name: Generate ASCCI Cowsay


on: 
    push

jobs:
    ascii-job:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v6
          with:
            sparse-checkout: |
             README.md
            sparse-checkout-cone-mode: false
        - name: Give Permission for ASCII Script
          run: |
            chmod +x ascii-script.sh
            ./ascii-script.sh