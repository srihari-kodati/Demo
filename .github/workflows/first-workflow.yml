name: First_WorkFlow

on: push

jobs:
    sample:
        runs-on: ubuntu-latest
        concurrency:
            group: trigger
            cancel-in-progress: true
        steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: List Files
          run: ls -ltra
        - name: Read File
          run: cat README.md


        - name: Sleep 60s
          run: sleep 60s
